[package]
name = "jmove"
version = "0.1.0"
edition = "2024"
description = "Project-aware file mover and import fixer for TypeScript/JavaScript and Java: rewrites every import, applies atomically, dry-run + JSON for AI agents."
license = "GPL-3.0-or-later"
repository = "https://github.com/loki5512344/jmove"
readme = "README.md"
keywords = ["refactoring", "imports", "java", "typescript", "rename"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ignore = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
thiserror = "2.0.20"
tree-sitter = "0.27.0"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
